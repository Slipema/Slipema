<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKU NGAMBEK BANGET</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #333;  /* Added gray background for bottom of site */
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 20px 50px;
            background: #333;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            color: white;
        }

        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('download (1).jpeg') center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero-content h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
        }

        .hero-content p {
            margin-bottom: 40px;  /* Added space between text and button */
        }

        .cta-button {
            padding: 15px 40px;
            background: transparent;  /* Made background invisible */
            color: white;
            border: 2px solid white;  /* White outline */
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 30px;  /* Added more space above button */
        }

        .cta-button:hover {
            background: white;
            color: #333;
        }

        .features {
            padding: 80px 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            background: #333;  /* Changed to gray */
            color: white;  /* Text color for features section */
        }

        .feature-card {
            text-align: center;
            padding: 30px;
            background: #444;  /* Darker gray for cards */
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .features {
                grid-template-columns: 1fr;
            }
            
            .navbar {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar"></nav>

    <section class="hero" id="home">
        <div class="hero-content">
            <h1>W NGAMBEK</h1>
            <p>KALAG CCA PEREBUTAN JUARA 3</p>
            <button class="cta-button">F</button>
        </div>
    </section>

    <section class="features" id="features">
        <div class="feature-card">
            <h3>NGAMBEK</h3>
            <p>DIKIT LAGI MENANG</p>
        </div>
        <div class="feature-card">
            <h3>NGAMBEK</h3>
            <p>BEDA DIKIT DOANG</p>
        </div>
        <div class="feature-card">
            <h3>NGAMBEJ</h3>
            <p>SEDIH</p>
        </div>
    </section>

   
</body>
</html>
